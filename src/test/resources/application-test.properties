# Automated tests use in-memory H2 (MySQL compatibility mode).
# Real MySQL is used with profile `local` via ./gradlew bootRun.
spring.datasource.url=jdbc:h2:mem:my_review_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Migrations target MySQL; tests only verify app wiring with H2
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-that-is-at-least-32b!
app.jwt.expiration-ms=3600000

app.naver.client-id=test-naver-client-id
app.naver.client-secret=test-naver-client-secret

app.kakao.client-id=test-kakao-client-id
app.kakao.client-secret=test-kakao-client-secret
app.kakao.redirect-uris=http://localhost:5173/auth/login/kakao/

app.google.client-id=test-google-client-id
app.google.client-secret=test-google-client-secret
app.google.redirect-uris=http://localhost:5173/auth/login/google/

# Tests invoke the use case directly; do not run the cron job.
spring.task.scheduling.enabled=false
app.user.purge.after-months=6
app.user.purge.cron=0 0 3 * * *
