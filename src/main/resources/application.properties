spring.application.name=my-review-server

# Local run: ./gradlew bootRun  → profile `local` (MySQL)
# Schema/tables are issue #3 — ddl-auto stays none here.

# OpenAPI / Swagger UI (springdoc)
# UI: http://localhost:8080/swagger-ui.html
# Spec: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (override secret via env JWT_SECRET / local secret file in production-like setups)
app.jwt.secret=${JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Naver Login (put real values in ./application-local-secret.properties or env)
app.naver.client-id=${NAVER_CLIENT_ID:}
app.naver.client-secret=${NAVER_CLIENT_SECRET:}

# Kakao Login (REST API key + client secret)
app.kakao.client-id=${KAKAO_CLIENT_ID:}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.kakao.redirect-uris=${KAKAO_REDIRECT_URIS:http://localhost:5173/auth/login/kakao/}

# Google Login (OAuth 2.0 Client ID/Secret from Google Cloud Console)
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uris=${GOOGLE_REDIRECT_URIS:http://localhost:5173/auth/login/google/}

# Hard-delete withdrawn users after retention (is_deleted=1 and deleted_at older than N months)
app.user.purge.after-months=${USER_PURGE_AFTER_MONTHS:6}
app.user.purge.cron=${USER_PURGE_CRON:0 0 3 * * *}

# Notification dispatcher (concrete rules are later issues)
app.notification.enabled=${NOTIFICATION_ENABLED:true}
app.notification.cron=${NOTIFICATION_CRON:0 0 9 * * *}

# Hard-delete soft-deleted notifications after retention (is_deleted=1 and deleted_at older than N months)
app.notification.purge.after-months=${NOTIFICATION_PURGE_AFTER_MONTHS:1}
app.notification.purge.cron=${NOTIFICATION_PURGE_CRON:0 0 4 * * *}

# Hard-delete soft-deleted platforms after retention; platforms still linked to an experience are kept
app.platform.purge.after-months=${PLATFORM_PURGE_AFTER_MONTHS:3}
app.platform.purge.cron=${PLATFORM_PURGE_CRON:0 30 4 * * *}
app.platform.purge.zone=${PLATFORM_PURGE_ZONE:Asia/Seoul}
